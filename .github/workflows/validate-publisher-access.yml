name: Validate publisher access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: selectel
    steps:
      - name: Mint wot-src token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wot-src
          permission-contents: write

      - name: Mint wot-gui-assets token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wot-gui-assets
          permission-contents: write
