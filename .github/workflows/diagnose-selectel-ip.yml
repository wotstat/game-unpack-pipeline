name: Diagnose Selectel public IP allocation
run-name: "IP capacity probe · ${{ inputs.regions }} · ${{ inputs.variants }}"
on:
  workflow_dispatch:
    inputs:
      regions:
        type: string
        default: ru-2
        required: true
      variants:
        type: string
        default: current-on
        required: true
permissions:
  contents: read
jobs:
  ip-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: selectel
    env:
      PYTHONUNBUFFERED: "1"
      PROBE_REGIONS: ${{ inputs.regions }}
      PROBE_VARIANTS: ${{ inputs.variants }}
      SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
      SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
      SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
      SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
      SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-openstack
      - name: Prepare temporary probe
        run: |
          cat >"${RUNNER_TEMP}/ip_capacity_probe.py" <<'PY'
          from __future__ import annotations
          import contextlib
          import importlib.util
          import io
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          from scripts import runner_lifecycle as current
          BASELINE="d22aef1ec954c465e47d3b4ae4301a8c8914700e"
          state=Path(os.environ["RUNNER_TEMP"])/"ip-probe-state.json"
          def config(region):
              os.environ["SELECTEL_OS_REGION_NAME"]=region
              os.environ["SELECTEL_PUBLIC_NETWORK_API_URL"]=f"https://{region}.cloud.api.selcloud.ru/public-network"
              return current.SelectelConfig.from_environment(require_compute=False)
          def cleanup(region,key):
              c=config(region)
              identity=current.build_identity(key)
              token=current.selectel_token(c)
              with contextlib.redirect_stdout(io.StringIO()):
                  current.delete_public_ports(c,identity,token)
                  current.delete_security_groups(c,identity)
              if current.find_public_port_ids(c,identity,token) or current.find_security_group_ids(c,identity):
                  raise RuntimeError("Probe resources still exist")
          def cleanup_all():
              for item in json.loads(state.read_text()) if state.exists() else []:
                  cleanup(**item)
              print("[IP-PROBE] Cleanup verified: no owned ports or security groups")
          if len(sys.argv)>1 and sys.argv[1]=="cleanup":
              cleanup_all()
              raise SystemExit(0)
          regions=os.environ["PROBE_REGIONS"].split(",")
          variants=os.environ["PROBE_VARIANTS"].split(",")
          assert all(x in {"ru-2","ru-3","ru-7","ru-9","ru-6","ru-8"} for x in regions)
          assert all(x in {"current-on","current-off","baseline"} for x in variants)
          def interrupted(*_): raise KeyboardInterrupt
          signal.signal(signal.SIGTERM,interrupted)
          modules={"current-on":current,"current-off":current}
          if "baseline" in variants:
              p=Path(os.environ["RUNNER_TEMP"])/"baseline_lifecycle.py"
              p.write_bytes(subprocess.check_output(["git","show",f"{BASELINE}:scripts/runner_lifecycle.py"]))
              spec=importlib.util.spec_from_file_location("baseline_lifecycle",p)
              old=importlib.util.module_from_spec(spec)
              sys.modules[spec.name]=old
              spec.loader.exec_module(old)
              modules["baseline"]=old
          states=[]
          results=[]
          for region in regions:
              for variant in variants:
                  module=modules[variant]
                  os.environ["SELECTEL_PREEMPTIBLE"]="true" if variant=="current-on" else "false"
                  config(region)
                  c=module.SelectelConfig.from_environment(require_compute=False)
                  key=f"ipprobe-{os.environ['GITHUB_RUN_ID']}-{region}-{variant}"
                  identity=module.build_identity(key)
                  states.append({"region":region,"key":key})
                  state.write_text(json.dumps(states))
                  record={"region":region,"variant":variant,"allocated":False,"cleanup":False}
                  token=module.selectel_token(c)
                  _,quota,_=module.http_json("GET",module.public_network_url(c,f"v1/projects/{c.project_id.replace('-','')}/quotas"),token=token)
                  record["quota"]=[{"limit":x.get("value"),"used":x.get("used")} for x in quota.get("network_direct_public_ips",[])]
                  try:
                      group=module.create_security_group(c,identity)
                      port,address=module.create_public_port(c,identity,group)
                      record["allocated"]=True
                  except module.LifecycleError as error:
                      message=str(error)
                      if "No available networks found" in message:
                          record["error"]="HTTP 400: No available networks found"
                      elif "quota" in message.lower():
                          record["error"]="Provider quota error"
                      else:
                          record["error"]=type(error).__name__
                  finally:
                      cleanup(region,key)
                      record["cleanup"]=True
                      results.append(record)
                      print("[IP-PROBE] "+json.dumps(record,sort_keys=True),flush=True)
                      with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as stream:
                          stream.write("- "+json.dumps(record,sort_keys=True)+"\n")
          print("[IP-PROBE] complete",flush=True)
          if not all(x["allocated"] for x in results):
              raise SystemExit(1)
          PY
      - name: Probe IP allocation and verify cleanup
        run: PYTHONPATH="${GITHUB_WORKSPACE}" python3 "${RUNNER_TEMP}/ip_capacity_probe.py"
      - name: Verify cleanup even after failure
        if: always()
        run: PYTHONPATH="${GITHUB_WORKSPACE}" python3 "${RUNNER_TEMP}/ip_capacity_probe.py" cleanup
