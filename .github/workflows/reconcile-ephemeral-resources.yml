name: Reconcile ephemeral runner cleanup
run-name: Cleanup Selectel resources for run ${{ inputs.source_run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Ephemeral snapshot
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID of Ephemeral snapshot
        required: true
        type: string
      source_run_attempt:
        description: Attempt number of that run
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile source run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: selectel
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
    env:
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Check out cleanup code from main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI
        uses: ./.github/actions/setup-openstack

      - name: Reconcile resources by deterministic ownership markers
        id: cleanup
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: |
          set -Eeuo pipefail
          instance_key="manual-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          cleanup_failed=0
          deleted_count=0
          for selectel_region in ru-7 ru-9; do
            export SELECTEL_OS_REGION_NAME="${selectel_region}"
            export SELECTEL_PUBLIC_NETWORK_API_URL="https://${selectel_region}.cloud.api.selcloud.ru/public-network"
            region_output="$(mktemp "${RUNNER_TEMP}/reconcile-${selectel_region}.XXXXXX")"
            if ! env GITHUB_OUTPUT="${region_output}" python3 scripts/runner_lifecycle.py cleanup \
              --instance-key "${instance_key}" \
              --run-id "${SOURCE_RUN_ID}" \
              --run-attempt "${SOURCE_RUN_ATTEMPT}" \
              --diagnostics; then
              cleanup_failed=1
            fi
            region_deleted="$(sed -n 's/^deleted_count=//p' "${region_output}" | tail -n 1)"
            if [[ "${region_deleted}" =~ ^[0-9]+$ ]]; then
              deleted_count=$((deleted_count + region_deleted))
            fi
          done
          echo "deleted_count=${deleted_count}" >>"${GITHUB_OUTPUT}"
          exit "${cleanup_failed}"

  notify-recovery:
    name: Telegram recovery alert
    needs: reconcile
    if: ${{ always() && fromJSON(needs.reconcile.outputs.deleted_count || '0') > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    steps:
      - name: Report leaked resources removed by reconciler
        # v1.1.1
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          disable_web_page_preview: true
          message: |
            🚨 Reconciler removed leftover ephemeral resources

            Deleted: ${{ needs.reconcile.outputs.deleted_count }}
            Reconciliation: ${{ needs.reconcile.result }}
            Source run: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.source_run_id || github.event.workflow_run.id }}
            Reconciliation run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
