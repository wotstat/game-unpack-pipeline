name: Process game release
run-name: Release · ${{ inputs.target }} · ${{ inputs.client_type }} · ${{ inputs.languages }} · ru-7b · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Game target
        required: true
        default: wot-eu
        type: choice
        options:
          - wot-eu
          - wot-na
          - wot-asia
          - wot-common-test
          - wot-cn
          - mt-ru
          - mt-public-test
      client_type:
        description: Client type
        required: true
        default: sd
        type: choice
        options:
          - sd
          - hd
      languages:
        description: Comma-separated languages or ALL
        required: true
        default: ALL
        type: string
      publish_wot_src:
        description: Publish the snapshot to wot-src
        required: true
        default: true
        type: boolean
      publish_wot_gui_assets:
        description: Publish the snapshot to wot-gui-assets
        required: true
        default: true
        type: boolean
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  SELECTEL_FLAVOR_ID: "HFL2.16-32768-256-AMD"
  SELECTEL_AVAILABILITY_ZONE: "ru-7b"
  SELECTEL_OS_REGION_NAME: "ru-7"
  SELECTEL_PUBLIC_NETWORK_API_URL: "https://ru-7.cloud.api.selcloud.ru/public-network"

jobs:
  provision:
    name: Provision (manual-${{ github.run_id }}-${{ github.run_attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: selectel
    outputs:
      port_id: ${{ steps.provision.outputs.port_id }}
      public_address: ${{ steps.provision.outputs.public_address }}
      resource_key: ${{ steps.provision.outputs.resource_key }}
      downloader_runner_id: ${{ steps.provision.outputs.downloader_runner_id }}
      downloader_runner_label: ${{ steps.provision.outputs.downloader_runner_label }}
      downloader_runner_name: ${{ steps.provision.outputs.downloader_runner_name }}
      wot_gui_assets_runner_id: ${{ steps.provision.outputs.wot_gui_assets_runner_id }}
      wot_gui_assets_runner_label: ${{ steps.provision.outputs.wot_gui_assets_runner_label }}
      wot_gui_assets_runner_name: ${{ steps.provision.outputs.wot_gui_assets_runner_name }}
      wot_src_runner_id: ${{ steps.provision.outputs.wot_src_runner_id }}
      wot_src_runner_label: ${{ steps.provision.outputs.wot_src_runner_label }}
      wot_src_runner_name: ${{ steps.provision.outputs.wot_src_runner_name }}
      runner_scope_label: ${{ steps.provision.outputs.runner_scope_label }}
      runner_version: ${{ steps.provision.outputs.runner_version }}
      security_group_id: ${{ steps.provision.outputs.security_group_id }}
      server_id: ${{ steps.provision.outputs.server_id }}
      server_name: ${{ steps.provision.outputs.server_name }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI
        uses: ./.github/actions/setup-openstack

      - name: Create VM and wait for runner
        id: provision
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_PUBLIC_TOKEN: ${{ github.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_ONLINE_TIMEOUT_SECONDS: "600"
          SELECTEL_IMAGE_ID: ${{ vars.SELECTEL_IMAGE_ID }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: >-
          python3 scripts/runner_lifecycle.py provision
          --instance-key "${INSTANCE_KEY}"

  download:
    name: Download and unpack (manual-${{ github.run_id }}-${{ github.run_attempt }})
    needs: provision
    runs-on:
      - self-hosted
      - ${{ needs.provision.outputs.downloader_runner_label }}
    timeout-minutes: 360
    outputs:
      snapshot_id: ${{ steps.result.outputs.snapshot_id }}
      version_name: ${{ steps.result.outputs.version_name }}
      readable_version: ${{ steps.result.outputs.readable_version }}
      snapshot_path: ${{ steps.result.outputs.snapshot_path }}
      descriptor_sha256: ${{ steps.result.outputs.descriptor_sha256 }}
    env:
      GAME_DOWNLOADER_CLIENT_TYPE: ${{ inputs.client_type }}
      GAME_DOWNLOADER_DATA_ROOT: /var/lib/game-downloader-data/${{ github.run_id }}-${{ github.run_attempt }}
      GAME_DOWNLOADER_LANGUAGES: ${{ inputs.languages }}
      GAME_DOWNLOADER_REPORT_DIR: /var/lib/game-downloader-data/${{ github.run_id }}-${{ github.run_attempt }}/action-reports
      GAME_DOWNLOADER_TARGET: ${{ inputs.target }}
      UV_COMPILE_BYTECODE: "1"
      UV_LINK_MODE: copy
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Inspect runner
        shell: bash
        run: |
          set -Eeuo pipefail
          online_cpus="$(getconf _NPROCESSORS_ONLN)"
          selected_workers="${online_cpus}"
          if (( selected_workers > 32 )); then
            selected_workers=32
          fi
          install -d -m 0700 \
            "${GAME_DOWNLOADER_DATA_ROOT}" \
            "${GAME_DOWNLOADER_REPORT_DIR}"
          echo "Host: $(hostname)"
          echo "Kernel: $(uname -srmo)"
          echo "CPUs: ${online_cpus}"
          echo "Workers: ${selected_workers}"
          printf 'GAME_DOWNLOADER_DOWNLOAD_WORKERS=%s\n' \
            "${selected_workers}" >>"${GITHUB_ENV}"
          free -h
          df -h "${GAME_DOWNLOADER_DATA_ROOT}"

      - name: Install system tools
        shell: bash
        env:
          FFDEC_SHA256: 0333b56998a55bd83f4e0deb678a811fcdc45607582b4f5dd438309c8c3ad5ce
          FFDEC_VERSION: 26.2.1
        run: |
          set -Eeuo pipefail
          if (( EUID == 0 )); then
            apt=(apt-get)
            privileged=()
          else
            apt=(sudo apt-get)
            privileged=(sudo)
          fi
          export DEBIAN_FRONTEND=noninteractive
          "${apt[@]}" update
          "${apt[@]}" install --yes --no-install-recommends \
            aria2 ca-certificates curl openjdk-17-jre-headless p7zip-full sysstat time unzip
          "${apt[@]}" clean
          "${privileged[@]}" rm -rf /var/lib/apt/lists/*

          ffdec_root="${RUNNER_TEMP}/ffdec"
          ffdec_archive="${RUNNER_TEMP}/ffdec.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version${FFDEC_VERSION}/ffdec_${FFDEC_VERSION}.zip" \
            --output "${ffdec_archive}"
          echo "${FFDEC_SHA256}  ${ffdec_archive}" | sha256sum --check --strict
          mkdir -p "${ffdec_root}"
          unzip -q "${ffdec_archive}" -d "${ffdec_root}"
          chmod 0555 "${ffdec_root}/ffdec" "${ffdec_root}/ffdec.sh"
          printf 'GAME_DOWNLOADER_FFDEC=%s/ffdec\n' "${ffdec_root}" >>"${GITHUB_ENV}"

      - name: Record runner performance inventory
        shell: bash
        run: >-
          python3 .github/scripts/performance-metrics.py inventory
          --data-root "${GAME_DOWNLOADER_DATA_ROOT}"
          --output "${GAME_DOWNLOADER_REPORT_DIR}/host-performance.json"

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.13.14"

      - name: Install downloader
        shell: bash
        run: uv sync --frozen --no-dev

      - name: Check runtime
        shell: bash
        run: uv run --no-sync game-downloader doctor --data-root "${GAME_DOWNLOADER_DATA_ROOT}"

      - name: Resolve release
        id: resolve
        shell: bash
        run: bash .github/scripts/run-stage.sh resolve

      - name: Plan acquisition
        shell: bash
        run: bash .github/scripts/run-stage.sh plan-acquisition

      - name: Download artifacts
        shell: bash
        run: bash .github/scripts/run-stage.sh download

      - name: Verify downloads
        shell: bash
        run: bash .github/scripts/run-stage.sh verify

      - name: Assemble client
        shell: bash
        run: bash .github/scripts/run-stage.sh assemble-client

      - name: Index VFS
        shell: bash
        run: bash .github/scripts/run-stage.sh index-vfs

      - name: Materialize VFS
        shell: bash
        run: bash .github/scripts/run-stage.sh materialize-vfs

      - name: Readable · Plan output
        shell: bash
        run: bash .github/scripts/run-stage.sh plan-readable

      - name: Readable · Transform Python, XML and translations
        shell: bash
        run: bash .github/scripts/run-stage.sh transform-readable

      - name: Readable · Decompile ActionScript
        shell: bash
        run: bash .github/scripts/run-stage.sh decompile-actionscript

      - name: Readable · Assemble and link tree
        shell: bash
        run: bash .github/scripts/run-stage.sh assemble-readable

      - name: Readable · Generate engine stubs
        shell: bash
        run: bash .github/scripts/run-stage.sh generate-engine-stubs

      - name: Readable · Finalize references
        shell: bash
        run: bash .github/scripts/run-stage.sh finalize-readable

      - name: Seal snapshot
        shell: bash
        run: bash .github/scripts/run-stage.sh snapshot

      - name: Render downloader report
        id: result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GAME_DOWNLOADER_RUN_ID:-}" ]]; then
            {
              echo '## Game download'
              echo
              echo 'The downloader failed before creating a Run.'
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          uv run --no-sync python .github/scripts/collect-result.py

      - name: Expose sealed snapshot to publisher runners
        if: always() && steps.result.outputs.snapshot_path != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          snapshot_path='${{ steps.result.outputs.snapshot_path }}'
          case "${snapshot_path}" in
            "${GAME_DOWNLOADER_DATA_ROOT}"/snapshots/sha256:*) ;;
            *)
              echo "snapshot path is outside the canonical snapshots directory" >&2
              exit 1
              ;;
          esac
          if [[ ! -d "${snapshot_path}" || -L "${snapshot_path}" ]]; then
            echo "snapshot path is not a sealed directory" >&2
            exit 1
          fi
          chmod 0711 "${GAME_DOWNLOADER_DATA_ROOT}"
          chmod 0711 "${GAME_DOWNLOADER_DATA_ROOT}/snapshots"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: game-downloader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GAME_DOWNLOADER_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  queue-watchdog:
    name: Queue watchdog (manual-${{ github.run_id }}-${{ github.run_attempt }})
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: selectel
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Wait for download assignment
        id: watch
        env:
          GITHUB_WATCH_TOKEN: ${{ github.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_LABEL: ${{ needs.provision.outputs.downloader_runner_label }}
        run: >-
          python3 scripts/runner_lifecycle.py watch-queue
          --instance-key "${INSTANCE_KEY}"
          --runner-label "${RUNNER_LABEL}"
          --timeout-seconds 600

      - name: Create cleanup GitHub App token
        if: steps.watch.outputs.timed_out == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI for timed-out cleanup
        if: steps.watch.outputs.timed_out == 'true'
        uses: ./.github/actions/setup-openstack

      - name: Delete resources after queue timeout
        if: steps.watch.outputs.timed_out == 'true'
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          PORT_ID: ${{ needs.provision.outputs.port_id }}
          DOWNLOADER_RUNNER_ID: ${{ needs.provision.outputs.downloader_runner_id }}
          WOT_GUI_ASSETS_RUNNER_ID: ${{ needs.provision.outputs.wot_gui_assets_runner_id }}
          WOT_SRC_RUNNER_ID: ${{ needs.provision.outputs.wot_src_runner_id }}
          SECURITY_GROUP_ID: ${{ needs.provision.outputs.security_group_id }}
          SERVER_ID: ${{ needs.provision.outputs.server_id }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: >-
          python3 scripts/runner_lifecycle.py cleanup
          --instance-key "${INSTANCE_KEY}"
          --downloader-runner-id "${DOWNLOADER_RUNNER_ID}"
          --wot-gui-assets-runner-id "${WOT_GUI_ASSETS_RUNNER_ID}"
          --wot-src-runner-id "${WOT_SRC_RUNNER_ID}"
          --server-id "${SERVER_ID}"
          --port-id "${PORT_ID}"
          --security-group-id "${SECURITY_GROUP_ID}"
          --diagnostics

      - name: Cancel workflow after queue timeout
        if: always() && steps.watch.outputs.timed_out == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel'

  publish-wot-src:
    name: Publish wot-src (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: inputs.publish_wot_src && needs.download.result == 'success' && needs.download.outputs.snapshot_path != ''
    needs:
      - provision
      - download
    uses: wotstat/wot-src/.github/workflows/publish-snapshot.yml@29f46bcfbac7d3e230eb763aaff5ce33f0b0d815
    with:
      runner_label: ${{ needs.provision.outputs.wot_src_runner_label }}
      snapshot_path: ${{ needs.download.outputs.snapshot_path }}
      expected_snapshot_id: ${{ needs.download.outputs.snapshot_id }}
      expected_descriptor_sha256: ${{ needs.download.outputs.descriptor_sha256 }}
      target: ${{ inputs.target }}
    permissions:
      contents: read
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  publish-wot-gui-assets:
    name: Publish wot-gui-assets (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: inputs.publish_wot_gui_assets && needs.download.result == 'success' && needs.download.outputs.snapshot_path != ''
    needs:
      - provision
      - download
    uses: wotstat/wot-gui-assets/.github/workflows/publish-snapshot.yml@bf7e276b659668c4f61fa31905812f6dc3b5ac0a
    with:
      runner_label: ${{ needs.provision.outputs.wot_gui_assets_runner_label }}
      snapshot_path: ${{ needs.download.outputs.snapshot_path }}
      expected_snapshot_id: ${{ needs.download.outputs.snapshot_id }}
      expected_descriptor_sha256: ${{ needs.download.outputs.descriptor_sha256 }}
      target: ${{ inputs.target }}
    permissions:
      contents: read
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  cleanup:
    name: Cleanup (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: always() && needs.provision.result != 'skipped'
    needs:
      - provision
      - download
      - queue-watchdog
      - publish-wot-gui-assets
      - publish-wot-src
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: selectel
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI
        uses: ./.github/actions/setup-openstack

      - name: Delete runner and Selectel resources
        id: cleanup
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          PORT_ID: ${{ needs.provision.outputs.port_id }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          DOWNLOADER_RUNNER_ID: ${{ needs.provision.outputs.downloader_runner_id }}
          WOT_GUI_ASSETS_PUBLISH_RESULT: ${{ needs.publish-wot-gui-assets.result }}
          WOT_GUI_ASSETS_PUBLISH_EXPECTED_RESULT: ${{ inputs.publish_wot_gui_assets && needs.download.outputs.snapshot_path != '' && 'success' || 'skipped' }}
          WOT_GUI_ASSETS_RUNNER_ID: ${{ needs.provision.outputs.wot_gui_assets_runner_id }}
          WOT_SRC_PUBLISH_RESULT: ${{ needs.publish-wot-src.result }}
          WOT_SRC_PUBLISH_EXPECTED_RESULT: ${{ inputs.publish_wot_src && needs.download.outputs.snapshot_path != '' && 'success' || 'skipped' }}
          WOT_SRC_RUNNER_ID: ${{ needs.provision.outputs.wot_src_runner_id }}
          SECURITY_GROUP_ID: ${{ needs.provision.outputs.security_group_id }}
          SERVER_ID: ${{ needs.provision.outputs.server_id }}
          DOWNLOAD_RESULT: ${{ needs.download.result }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: |
          set -Eeuo pipefail
          diagnostics=()
          if [[ "${PROVISION_RESULT}" != success \
            || "${DOWNLOAD_RESULT}" != success \
            || "${WOT_GUI_ASSETS_PUBLISH_RESULT}" != "${WOT_GUI_ASSETS_PUBLISH_EXPECTED_RESULT}" \
            || "${WOT_SRC_PUBLISH_RESULT}" != "${WOT_SRC_PUBLISH_EXPECTED_RESULT}" ]]; then
            diagnostics+=(--diagnostics)
          fi
          python3 scripts/runner_lifecycle.py cleanup \
            --instance-key "${INSTANCE_KEY}" \
            --downloader-runner-id "${DOWNLOADER_RUNNER_ID}" \
            --wot-gui-assets-runner-id "${WOT_GUI_ASSETS_RUNNER_ID}" \
            --wot-src-runner-id "${WOT_SRC_RUNNER_ID}" \
            --server-id "${SERVER_ID}" \
            --port-id "${PORT_ID}" \
            --security-group-id "${SECURITY_GROUP_ID}" \
            "${diagnostics[@]}"

  record-status:
    name: Record release status (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: >-
      always() &&
      needs.download.result == 'success' &&
      needs.queue-watchdog.result == 'success' &&
      needs.cleanup.result == 'success' &&
      (!inputs.publish_wot_src || needs.publish-wot-src.result == 'success') &&
      (!inputs.publish_wot_gui_assets || needs.publish-wot-gui-assets.result == 'success')
    needs:
      - provision
      - download
      - queue-watchdog
      - publish-wot-gui-assets
      - publish-wot-src
      - cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-status-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update release status
        id: status
        env:
          RELEASE_NAME: ${{ needs.download.outputs.version_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          result="$(python3 scripts/release_status.py write \
            --target "${TARGET}" \
            --release-name "${RELEASE_NAME}")"
          echo "result=${result}" >>"${GITHUB_OUTPUT}"
          echo "${TARGET}: ${result} release status ${RELEASE_NAME}"

      - name: Commit release status
        if: steps.status.outputs.result == 'changed'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_NAME: ${{ needs.download.outputs.version_name }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "status/${TARGET}.json"
          git commit -m "Record ${TARGET} release ${RELEASE_NAME}"
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

  dispatch-reconciler:
    name: Dispatch reconciler (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: >-
      always() &&
      github.actor == 'github-actions[bot]' &&
      needs.provision.result != 'skipped'
    needs:
      - provision
      - cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch cleanup reconciliation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          gh workflow run reconcile-release-resources.yml \
            --ref "${DEFAULT_BRANCH}" \
            --field source_run_id="${SOURCE_RUN_ID}" \
            --field source_run_attempt="${SOURCE_RUN_ATTEMPT}"

  notify:
    name: Telegram report (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: always()
    needs:
      - provision
      - download
      - queue-watchdog
      - publish-wot-gui-assets
      - publish-wot-src
      - cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out report renderer
        uses: actions/checkout@v7.0.1

      - name: Read pipeline start time
        id: timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          --jq '.run_started_at'
          | sed 's/^/started_at=/'
          >>"${GITHUB_OUTPUT}"

      - name: Render pipeline report
        id: report
        env:
          PIPELINE_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          TARGET: ${{ inputs.target }}
          READABLE_VERSION: ${{ needs.download.outputs.readable_version }}
          CLIENT_TYPE: ${{ inputs.client_type }}
          LANGUAGES: ${{ inputs.languages }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          DOWNLOAD_RESULT: ${{ needs.download.result }}
          QUEUE_WATCHDOG_RESULT: ${{ needs.queue-watchdog.result }}
          WOT_SRC_ENABLED: ${{ inputs.publish_wot_src }}
          WOT_SRC_RESULT: ${{ needs.publish-wot-src.result }}
          WOT_SRC_PUBLICATION_STATE: ${{ needs.publish-wot-src.outputs.publication_state }}
          WOT_SRC_COMMIT_SHA: ${{ needs.publish-wot-src.outputs.commit_sha }}
          WOT_GUI_ASSETS_ENABLED: ${{ inputs.publish_wot_gui_assets }}
          WOT_GUI_ASSETS_RESULT: ${{ needs.publish-wot-gui-assets.result }}
          WOT_GUI_ASSETS_PUBLICATION_STATE: ${{ needs.publish-wot-gui-assets.outputs.publication_state }}
          WOT_GUI_ASSETS_COMMIT_SHA: ${{ needs.publish-wot-gui-assets.outputs.commit_sha }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          CLEANUP_DELETED_COUNT: ${{ needs.cleanup.outputs.deleted_count || 'unknown' }}
          PIPELINE_STARTED_AT: ${{ steps.timing.outputs.started_at }}
          PIPELINE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/render_telegram_report.py

      - name: Send pipeline report
        # v1.1.1
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          format: html
          disable_web_page_preview: true
          message: ${{ steps.report.outputs.message }}
