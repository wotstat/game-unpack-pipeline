name: Ephemeral snapshot
run-name: ${{ inputs.benchmark_percent > 0 && 'Benchmark' || (inputs.light && 'Light' || 'Full') }} through ${{ inputs.until }} · ${{ inputs.target }} · ${{ inputs.client_type }} · ${{ inputs.languages }} · ${{ inputs.runner_profile }} · ${{ inputs.selectel_location }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Game target
        required: true
        default: wot-eu
        type: choice
        options:
          - wot-eu
          - wot-na
          - wot-asia
          - wot-common-test
          - wot-cn
          - mt-ru
          - mt-public-test
      client_type:
        description: Client type
        required: true
        default: sd
        type: choice
        options:
          - sd
          - hd
      languages:
        description: Comma-separated languages or ALL
        required: true
        default: EN
        type: string
      light:
        description: Build a minimal integration-test snapshot
        required: true
        default: true
        type: boolean
      benchmark_percent:
        description: Deterministic incomplete benchmark sample; 0 disables it
        required: true
        default: 0
        type: number
      until:
        description: Last pipeline stage to execute
        required: true
        default: snapshot
        type: choice
        options:
          - resolve
          - plan-acquisition
          - download
          - verify
          - assemble-client
          - index-vfs
          - materialize-vfs
          - plan-readable
          - transform-readable
          - decompile-actionscript
          - assemble-readable
          - generate-engine-stubs
          - finalize-readable
          - snapshot
      workers:
        description: Parallel workers; 0 uses runner CPU count, capped at 32
        required: true
        default: 0
        type: number
      publish_wot_src:
        description: Publish the snapshot to wot-src
        required: true
        default: true
        type: boolean
      publish_wot_gui_assets:
        description: Publish the snapshot to wot-gui-assets
        required: true
        default: true
        type: boolean
      runner_profile:
        description: Selectel runner CPU profile (HighFreq is available only in ru-9a)
        required: true
        default: configured-standard
        type: choice
        options:
          - configured-standard
          - highfreq-16c-32g
      selectel_location:
        description: Selectel region and availability zone
        required: true
        default: ru-7a
        type: choice
        options:
          - ru-7a
          - ru-9a
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  SELECTEL_AVAILABILITY_ZONE: ${{ inputs.selectel_location }}
  SELECTEL_OS_REGION_NAME: ${{ inputs.selectel_location == 'ru-7a' && 'ru-7' || 'ru-9' }}
  SELECTEL_PUBLIC_NETWORK_API_URL: ${{ inputs.selectel_location == 'ru-7a' && 'https://ru-7.cloud.api.selcloud.ru/public-network' || 'https://ru-9.cloud.api.selcloud.ru/public-network' }}

jobs:
  provision:
    name: Provision (manual-${{ github.run_id }}-${{ github.run_attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: selectel
    outputs:
      port_id: ${{ steps.provision.outputs.port_id }}
      public_address: ${{ steps.provision.outputs.public_address }}
      resource_key: ${{ steps.provision.outputs.resource_key }}
      builder_runner_id: ${{ steps.provision.outputs.builder_runner_id }}
      builder_runner_label: ${{ steps.provision.outputs.builder_runner_label }}
      builder_runner_name: ${{ steps.provision.outputs.builder_runner_name }}
      wot_gui_assets_runner_id: ${{ steps.provision.outputs.wot_gui_assets_runner_id }}
      wot_gui_assets_runner_label: ${{ steps.provision.outputs.wot_gui_assets_runner_label }}
      wot_gui_assets_runner_name: ${{ steps.provision.outputs.wot_gui_assets_runner_name }}
      wot_src_runner_id: ${{ steps.provision.outputs.wot_src_runner_id }}
      wot_src_runner_label: ${{ steps.provision.outputs.wot_src_runner_label }}
      wot_src_runner_name: ${{ steps.provision.outputs.wot_src_runner_name }}
      runner_scope_label: ${{ steps.provision.outputs.runner_scope_label }}
      runner_version: ${{ steps.provision.outputs.runner_version }}
      security_group_id: ${{ steps.provision.outputs.security_group_id }}
      server_id: ${{ steps.provision.outputs.server_id }}
      server_name: ${{ steps.provision.outputs.server_name }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI
        uses: ./.github/actions/setup-openstack

      - name: Create VM and wait for runner
        id: provision
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_PUBLIC_TOKEN: ${{ github.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_ONLINE_TIMEOUT_SECONDS: "600"
          SELECTEL_FLAVOR_ID: ${{ inputs.runner_profile == 'highfreq-16c-32g' && 'HFL1.16-32768-240' || vars.SELECTEL_FLAVOR_ID }}
          SELECTEL_IMAGE_ID: ${{ vars.SELECTEL_IMAGE_ID }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: >-
          python3 scripts/runner_lifecycle.py provision
          --instance-key "${INSTANCE_KEY}"

  workload:
    name: Workload (manual-${{ github.run_id }}-${{ github.run_attempt }})
    needs: provision
    uses: wotstat/game-snapshot-builder/.github/workflows/build-snapshot.yml@v0.3.16
    with:
      runner_label: ${{ needs.provision.outputs.builder_runner_label }}
      target: ${{ inputs.target }}
      client_type: ${{ inputs.client_type }}
      languages: ${{ inputs.languages }}
      light: ${{ inputs.light }}
      benchmark_percent: ${{ fromJSON(inputs.benchmark_percent) }}
      until: ${{ inputs.until }}
      # CLI dispatch fields arrive as strings; workflow_call requires a real number.
      workers: ${{ fromJSON(inputs.workers) }}
      profile_stages: true
    permissions:
      contents: read

  queue-watchdog:
    name: Queue watchdog (manual-${{ github.run_id }}-${{ github.run_attempt }})
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: selectel
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Wait for workload assignment
        id: watch
        env:
          GITHUB_WATCH_TOKEN: ${{ github.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_LABEL: ${{ needs.provision.outputs.builder_runner_label }}
        run: >-
          python3 scripts/runner_lifecycle.py watch-queue
          --instance-key "${INSTANCE_KEY}"
          --runner-label "${RUNNER_LABEL}"
          --timeout-seconds 600

      - name: Create cleanup GitHub App token
        if: steps.watch.outputs.timed_out == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI for timed-out cleanup
        if: steps.watch.outputs.timed_out == 'true'
        uses: ./.github/actions/setup-openstack

      - name: Delete resources after queue timeout
        if: steps.watch.outputs.timed_out == 'true'
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          PORT_ID: ${{ needs.provision.outputs.port_id }}
          BUILDER_RUNNER_ID: ${{ needs.provision.outputs.builder_runner_id }}
          WOT_GUI_ASSETS_RUNNER_ID: ${{ needs.provision.outputs.wot_gui_assets_runner_id }}
          WOT_SRC_RUNNER_ID: ${{ needs.provision.outputs.wot_src_runner_id }}
          SECURITY_GROUP_ID: ${{ needs.provision.outputs.security_group_id }}
          SERVER_ID: ${{ needs.provision.outputs.server_id }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: >-
          python3 scripts/runner_lifecycle.py cleanup
          --instance-key "${INSTANCE_KEY}"
          --builder-runner-id "${BUILDER_RUNNER_ID}"
          --wot-gui-assets-runner-id "${WOT_GUI_ASSETS_RUNNER_ID}"
          --wot-src-runner-id "${WOT_SRC_RUNNER_ID}"
          --server-id "${SERVER_ID}"
          --port-id "${PORT_ID}"
          --security-group-id "${SECURITY_GROUP_ID}"
          --diagnostics

      - name: Cancel workflow after queue timeout
        if: always() && steps.watch.outputs.timed_out == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel'

  publish-wot-src:
    name: Publish wot-src (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: inputs.publish_wot_src && needs.workload.result == 'success' && needs.workload.outputs.snapshot_path != ''
    needs:
      - provision
      - workload
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      publisher: wot-src
      publisher_ref: 0b4f837c14d74de0761002c246d1033c18d9a71e
      runner_label: ${{ needs.provision.outputs.wot_src_runner_label }}
      snapshot_path: ${{ needs.workload.outputs.snapshot_path }}
      expected_snapshot_id: ${{ needs.workload.outputs.snapshot_id }}
      expected_descriptor_sha256: ${{ needs.workload.outputs.descriptor_sha256 }}
      expected_profile: ${{ inputs.light && 'light' || 'full' }}
      target: ${{ inputs.target }}
      branch: ${{ inputs.light && format('test/light-{0}', inputs.target) || inputs.target }}
    permissions:
      contents: read
    secrets: inherit

  publish-wot-gui-assets:
    name: Publish wot-gui-assets (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: inputs.publish_wot_gui_assets && needs.workload.result == 'success' && needs.workload.outputs.snapshot_path != ''
    needs:
      - provision
      - workload
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      publisher: wot-gui-assets
      publisher_ref: c5fe1fc6fd23b8e571b4a2cb9cfd4342e28834dd
      runner_label: ${{ needs.provision.outputs.wot_gui_assets_runner_label }}
      snapshot_path: ${{ needs.workload.outputs.snapshot_path }}
      expected_snapshot_id: ${{ needs.workload.outputs.snapshot_id }}
      expected_descriptor_sha256: ${{ needs.workload.outputs.descriptor_sha256 }}
      expected_profile: ${{ inputs.light && 'light' || 'full' }}
      target: ${{ inputs.target }}
      branch: ${{ inputs.light && format('test/light-{0}', inputs.target) || inputs.target }}
    permissions:
      contents: read
    secrets: inherit

  cleanup:
    name: Cleanup (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: always() && needs.provision.result != 'skipped'
    needs:
      - provision
      - workload
      - queue-watchdog
      - publish-wot-gui-assets
      - publish-wot-src
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: selectel
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Install OpenStack CLI
        uses: ./.github/actions/setup-openstack

      - name: Delete runner and Selectel resources
        id: cleanup
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTANCE_KEY: manual-${{ github.run_id }}-${{ github.run_attempt }}
          PORT_ID: ${{ needs.provision.outputs.port_id }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          BUILDER_RUNNER_ID: ${{ needs.provision.outputs.builder_runner_id }}
          WOT_GUI_ASSETS_PUBLISH_RESULT: ${{ needs.publish-wot-gui-assets.result }}
          WOT_GUI_ASSETS_PUBLISH_EXPECTED_RESULT: ${{ inputs.publish_wot_gui_assets && needs.workload.outputs.snapshot_path != '' && 'success' || 'skipped' }}
          WOT_GUI_ASSETS_RUNNER_ID: ${{ needs.provision.outputs.wot_gui_assets_runner_id }}
          WOT_SRC_PUBLISH_RESULT: ${{ needs.publish-wot-src.result }}
          WOT_SRC_PUBLISH_EXPECTED_RESULT: ${{ inputs.publish_wot_src && needs.workload.outputs.snapshot_path != '' && 'success' || 'skipped' }}
          WOT_SRC_RUNNER_ID: ${{ needs.provision.outputs.wot_src_runner_id }}
          SECURITY_GROUP_ID: ${{ needs.provision.outputs.security_group_id }}
          SERVER_ID: ${{ needs.provision.outputs.server_id }}
          WORKLOAD_RESULT: ${{ needs.workload.result }}
          SELECTEL_OS_AUTH_URL: ${{ vars.SELECTEL_OS_AUTH_URL }}
          SELECTEL_OS_PASSWORD: ${{ secrets.SELECTEL_OS_PASSWORD }}
          SELECTEL_OS_PROJECT_ID: ${{ vars.SELECTEL_OS_PROJECT_ID }}
          SELECTEL_OS_USERNAME: ${{ vars.SELECTEL_OS_USERNAME }}
          SELECTEL_OS_USER_DOMAIN_NAME: ${{ vars.SELECTEL_OS_USER_DOMAIN_NAME }}
        run: |
          set -Eeuo pipefail
          diagnostics=()
          if [[ "${PROVISION_RESULT}" != success \
            || "${WORKLOAD_RESULT}" != success \
            || "${WOT_GUI_ASSETS_PUBLISH_RESULT}" != "${WOT_GUI_ASSETS_PUBLISH_EXPECTED_RESULT}" \
            || "${WOT_SRC_PUBLISH_RESULT}" != "${WOT_SRC_PUBLISH_EXPECTED_RESULT}" ]]; then
            diagnostics+=(--diagnostics)
          fi
          python3 scripts/runner_lifecycle.py cleanup \
            --instance-key "${INSTANCE_KEY}" \
            --builder-runner-id "${BUILDER_RUNNER_ID}" \
            --wot-gui-assets-runner-id "${WOT_GUI_ASSETS_RUNNER_ID}" \
            --wot-src-runner-id "${WOT_SRC_RUNNER_ID}" \
            --server-id "${SERVER_ID}" \
            --port-id "${PORT_ID}" \
            --security-group-id "${SECURITY_GROUP_ID}" \
            "${diagnostics[@]}"

  notify:
    name: Telegram report (manual-${{ github.run_id }}-${{ github.run_attempt }})
    if: always()
    needs:
      - provision
      - workload
      - queue-watchdog
      - publish-wot-gui-assets
      - publish-wot-src
      - cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    steps:
      - name: Send pipeline report
        # v1.1.1
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          disable_web_page_preview: true
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ FAILURE' || contains(needs.*.result, 'cancelled') && '⚠️ CANCELLED' || '✅ SUCCESS' }}
            Ephemeral snapshot · ${{ inputs.target }} · ${{ inputs.client_type }}

            Mode: ${{ inputs.benchmark_percent > 0 && format('benchmark {0}%', inputs.benchmark_percent) || (inputs.light && 'light' || 'full') }} through ${{ inputs.until }}
            Languages: ${{ inputs.languages }}
            Provision: ${{ needs.provision.result }}
            Builder: ${{ needs.workload.result }}
            Queue watchdog: ${{ needs.queue-watchdog.result }}
            wot-src: ${{ inputs.publish_wot_src && needs.publish-wot-src.result || 'disabled' }}
            wot-gui-assets: ${{ inputs.publish_wot_gui_assets && needs.publish-wot-gui-assets.result || 'disabled' }}
            Cleanup: ${{ needs.cleanup.result }} (deleted: ${{ needs.cleanup.outputs.deleted_count || 'unknown' }})
            Snapshot: ${{ needs.workload.outputs.snapshot_id || 'not created' }}

            wot-src publication: ${{ !inputs.publish_wot_src && 'disabled' || needs.publish-wot-src.outputs.publication_state || 'not started' }} · ${{ needs.publish-wot-src.outputs.commit_sha || 'no commit' }}
            wot-gui-assets publication: ${{ !inputs.publish_wot_gui_assets && 'disabled' || needs.publish-wot-gui-assets.outputs.publication_state || 'not started' }} · ${{ needs.publish-wot-gui-assets.outputs.commit_sha || 'no commit' }}
            Pipeline run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
