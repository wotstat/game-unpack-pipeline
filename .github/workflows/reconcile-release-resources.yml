name: Reconcile release resources
run-name: "Resources · release run #${{ inputs.source_run_id || github.event.workflow_run.id }}"

on:
  workflow_run:
    workflows:
      - Process game release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID of Process game release
        required: true
        type: string
      source_run_attempt:
        description: Attempt number of that run
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: aeza-reconciliation-${{ inputs.source_run_id || github.event.workflow_run.id }}-${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile source run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aeza
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
    env:
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt || github.event.workflow_run.run_attempt }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Check out cleanup code from main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: game-unpack-pipeline
          permission-administration: write

      - name: Reconcile resources by deterministic ownership markers
        if: always()
        id: cleanup
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          AEZA_API_KEY: ${{ secrets.AEZA_API_KEY }}
        run: |
          set -Eeuo pipefail
          python3 scripts/runner_lifecycle.py cleanup \
            --instance-key "manual-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
            --run-id "${SOURCE_RUN_ID}" \
            --run-attempt "${SOURCE_RUN_ATTEMPT}"

  notify-recovery:
    name: Telegram recovery alert
    needs: reconcile
    if: ${{ always() && fromJSON(needs.reconcile.outputs.deleted_count || '0') > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    steps:
      - name: Report leaked resources removed by reconciler
        # v1.1.1
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          disable_web_page_preview: true
          message: |
            🚨 Reconciler removed leftover ephemeral resources

            Deleted: ${{ needs.reconcile.outputs.deleted_count }}
            Reconciliation: ${{ needs.reconcile.result }}
            Source run: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.source_run_id || github.event.workflow_run.id }}
            Reconciliation run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
