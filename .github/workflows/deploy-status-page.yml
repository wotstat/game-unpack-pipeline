name: Deploy status page

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-status-page.yml
      - scripts/release_status.py
      - scripts/render_status_page.py
      - status/**
      - status-page/**

concurrency:
  group: status-page-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build status page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out complete status history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Render status page
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python3 scripts/render_status_page.py
          --output-dir _site
          --site-url "${SITE_URL}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy status page
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.0
